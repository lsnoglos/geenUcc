  <script>
    window.addEventListener('load', function() {
    const statusEl = document.getElementById('location-status');
    const latInput = document.getElementById('latitud');
    const lonInput = document.getElementById('longitud');
    const manualToggle = document.getElementById('manual-location-toggle');
    const autoFields = document.getElementById('auto-location-fields');
    
  google.script.run
        .withSuccessHandler(function(logoResult) {
          if (logoResult.success) {
            document.getElementById('header-logo2').src = logoResult.base64;
        }
    })
  .getDefaultLogoBase64();

    function getLocation() {
      if (navigator.geolocation) {
        statusEl.textContent = 'Solicitando permiso de ubicación...';
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            latInput.value = lat;
            lonInput.value = lon;
            statusEl.textContent = `✅ Coordenadas: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
          },
          (error) => {
            statusEl.textContent = `❌ Permiso de GPS denegado. Se guardará sin coordenadas.`;
            latInput.value = '';
            lonInput.value = '';
          }
        );
      } else {
        statusEl.textContent = 'Geolocalización no es soportada por este navegador.';
      }
    }

    function toggleLocationFields() {
      //obtener o no gps
      if (manualToggle.checked) {
        autoFields.style.display = 'none';
        latInput.value = '';
        lonInput.value = '';
      } else {
        autoFields.style.display = 'block';
        getLocation();
      }
    }
    manualToggle.addEventListener('change', toggleLocationFields);
    getLocation();
  });

  let photoFiles = [];
  const photoInput = document.getElementById('photo-input');
  const cameraInput = document.getElementById('camera-input');
  const thumbnailsContainer = document.getElementById('thumbnails');
  
  photoInput.addEventListener('change', handleFiles);
  cameraInput.addEventListener('change', handleFiles);

function handleFiles(event) {
    const files = event.target.files;
    const promises = [];

    for (let i = 0; i < files.length; i++) {
      promises.push(
        resizeImage(files[i]).then(resized => {
          photoFiles.push(resized);
        })
      );
    }

    Promise.all(promises).then(() => {
      renderThumbnails();
    });

    event.target.value = '';
  }

  function resizeImage(file, maxSize = 1200, quality = 0.8) {
    return new Promise((resolve) => {
      const img = new Image();
      const reader = new FileReader();

      reader.onload = (e) => img.src = e.target.result;

      img.onload = () => {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxSize) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          }
        } else {
          if (height > maxSize) {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(
          (blob) => {
            resolve(new File([blob], file.name, { type: "image/jpeg" }));
          },
          "image/jpeg",
          quality
        );
      };

      reader.readAsDataURL(file);
    });
  }

  function renderThumbnails() {
    thumbnailsContainer.innerHTML = '';
    photoFiles.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const thumbItem = document.createElement('div');
        thumbItem.className = 'thumbnail-item';
        thumbItem.innerHTML = `<img src="${e.target.result}" alt="thumbnail"><button type="button" class="delete-btn" data-index="${index}">&times;</button>`;
        thumbnailsContainer.appendChild(thumbItem);
      };
      reader.readAsDataURL(file);
    });
  }

  thumbnailsContainer.addEventListener('click', function(e) {
    if (e.target.classList.contains('delete-btn')) {
      e.preventDefault(); // Prevenir que el botón envíe el formulario
      const index = parseInt(e.target.dataset.index);
      photoFiles.splice(index, 1);
      renderThumbnails();
    }
  });

  function generateStyledQR(url, logoBase64, callback) {
    const desiredResolution = 1000; // Píxeles. Un buen punto de partida para impresión.
                                    // Puedes probar con 1500 o 2000 si necesitas más.
    const canvas = document.createElement('canvas');
    canvas.width = desiredResolution;
    canvas.height = desiredResolution;
    const ctx = canvas.getContext('2d');
    
    let logoImage = null;
    if (logoBase64) {
      logoImage = new Image();
      // Ajuste para CORS si el logo no carga (a veces puede pasar con imágenes base64 si no son perfectas)
      logoImage.crossOrigin = "Anonymous"; 
      logoImage.onload = () => draw(false);
      logoImage.onerror = () => { 
        console.warn("Logo no cargó, dibujando QR sin él. Verifique el ID o permisos del logo."); 
        draw(true); 
      };
      logoImage.src = logoBase64;
    } else {
      draw(true); // Dibuja sin logo si no se proporcionó
    }

    function draw(logoFailed) {
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const qr = qrcode(0, 'H'); // Nivel de corrección 'High' es adecuado.
      qr.addData(url);
      qr.make();
      const moduleCount = qr.getModuleCount();
      
      // Ajustamos el tamaño del módulo basándonos en la nueva resolución y el margen
      const marginModules = 4; // Borde de 2 módulos en cada lado (total 4 módulos adicionales)
      const moduleSize = canvas.width / (moduleCount + marginModules); 

      // Mismo degradado de alto contraste
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#257732"); 
      gradient.addColorStop(1, "#3e1a09");
      ctx.fillStyle = gradient;
      
      // El logo sigue siendo un 25% del *nuevo* tamaño total del QR
      const logoDimension = canvas.width * 0.25; 
      const logoX = (canvas.width - logoDimension) / 2;
      const logoY = (canvas.height - logoDimension) / 2;

      for (let r = 0; r < moduleCount; r++) {
        for (let c = 0; c < moduleCount; c++) {
          if (qr.isDark(r, c)) {
            // Ajuste de posición por el margen de 2 módulos
            const x = (c + (marginModules / 2)) * moduleSize; 
            const y = (r + (marginModules / 2)) * moduleSize; 
            
            if (!logoFailed && x < logoX + logoDimension && x + moduleSize > logoX && y < logoY + logoDimension && y + moduleSize > logoY) {
              continue;
            }

            // Usamos cuadrados para máxima fiabilidad en la lectura
            ctx.fillRect(x, y, moduleSize, moduleSize);
          }
        }
      }
      
      // Dibujar el logo si no falló
      if (!logoFailed && logoImage) {
        const borderRadius = 8; 
        ctx.save();
        ctx.beginPath();
        // Dibujamos el rectángulo redondeado para el clip mask
        ctx.moveTo(logoX + borderRadius, logoY);
        ctx.arcTo(logoX + logoDimension, logoY, logoX + logoDimension, logoY + logoDimension, borderRadius);
        ctx.arcTo(logoX + logoDimension, logoY + logoDimension, logoX, logoY + logoDimension, borderRadius);
        ctx.arcTo(logoX, logoY + logoDimension, logoX, logoY, borderRadius);
        ctx.arcTo(logoX, logoY, logoX + logoDimension, logoY, borderRadius);
        ctx.closePath();
        ctx.clip(); // Aplicar la máscara
        ctx.drawImage(logoImage, logoX, logoY, logoDimension, logoDimension);
        ctx.restore(); // Restaurar el contexto del canvas
      }
      
      callback(canvas.toDataURL('image/png'));
    }
  }

  document.getElementById('plantForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    
    if (photoFiles.length === 0) {
      statusDiv.textContent = 'Debes agregar al menos una foto.';
      statusDiv.style.color = 'red';
      return;
    }

    showLoader('Procesando imágenes...', true);
    submitBtn.disabled = true;
    
    const filesDataPromises = photoFiles.map(file => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          name: file.name,
          mimeType: file.type,
          base64: reader.result.split(',')[1]
        });
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    });

    Promise.all(filesDataPromises).then(filesData => {
      showLoader('Registrando datos de la planta...');
      const formObject = Object.fromEntries(new FormData(e.target).entries());

      google.script.run
        .withSuccessHandler(dataResponse => {
          if (!dataResponse.success) {
            onFailure({ message: dataResponse.message });
            return;
          }
          
          showLoader('Generando Código QR...');
          const continueProcess = (logoBase64) => {
            generateStyledQR(dataResponse.plantViewUrl, logoBase64, (qrBase64) => {
              showLoader('Guardando archivos y enviando correo...', false); // No cancelable en el último paso
              google.script.run
                .withSuccessHandler(onSuccess)
                .withFailureHandler(onFailure)
                .savePlantFiles(dataResponse.plantId, qrBase64, filesData);
            });
          };
          google.script.run.withSuccessHandler(logoResponse => {
            continueProcess(logoResponse.success ? logoResponse.base64 : null);
          }).withFailureHandler(() => continueProcess(null))
          .getDefaultLogoBase64();
        })
        .withFailureHandler(onFailure)
        .registerPlantData(formObject);
    });
  });

  function onSuccess(response) {

  hideLoader();

  const mainTitle = document.getElementById('page-title');
  const statusDiv = document.getElementById('status');
  const form = document.getElementById('plantForm');

  mainTitle.textContent = "Registrado con Éxito";
  statusDiv.textContent = "Planta registrada y QR enviado a tu correo.";
  statusDiv.style.color = 'green';
  
  form.style.display = 'none';

  // Botón principal de éxito
  const successLink = document.createElement('a');
  successLink.href = '<?= dashboardUrl ?>';
  successLink.className = 'btn-success';
  successLink.textContent = '✓ ¡Éxito! Volver a Mis Plantas';
  statusDiv.insertAdjacentElement('afterend', successLink);

  // FAB para “registrar otra planta” sin reload
  const fab = document.createElement('a');
  fab.className = 'fab';
  fab.title = 'Registrar otra Planta';
  fab.textContent = '+';

fab.addEventListener('click', function(e) {
  e.preventDefault();

  // Restaurar título y mensajes
  document.getElementById('page-title').textContent = 'Nueva';
  const statusDiv = document.getElementById('status');
  statusDiv.textContent = '';
  statusDiv.style.color = 'black';

  // Restaurar formulario
  const form = document.getElementById('plantForm');
  form.style.display = 'block';
  form.reset();

  // Limpiar inputs type=file manualmente
  document.getElementById('photo-input').value = '';
  document.getElementById('camera-input').value = '';

  // Limpiar array de fotos y thumbnails
  photoFiles.length = 0; // Mantiene referencia global, vacía el array
  document.getElementById('thumbnails').innerHTML = '';

  // Reactivar botón de enviar
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = false;
  submitBtn.textContent = 'Registrar Planta';

  // Quitar FAB y link de éxito
  fab.remove();
  const successLink = document.querySelector('.btn-success');
  if (successLink) successLink.remove();
});


  document.body.appendChild(fab);
}


  function onFailure(error) {

    hideLoader();

    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    statusDiv.textContent = 'Error: ' + error.message;
    statusDiv.style.color = 'red';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Registrar y Generar QR';
  }

  document.getElementById('logoutBtn').addEventListener('click', function(e) {
    e.preventDefault();
    this.textContent = 'Cerrando...';
    google.script.run
      .withSuccessHandler(onLogoutSuccess)
      .softLogout();
  });

  function onLogoutSuccess(redirectUrl) {
    window.top.location.href = redirectUrl;
  }

  // GEMINI
const btnIdentificar = document.getElementById('btnIdentificar');
const modal = document.getElementById('gemini-modal');
const modalTitle = document.getElementById('gemini-modal-title');
const modalBody = document.getElementById('gemini-modal-body');
const btnAceptar = document.getElementById('btnAceptarIdentificacion');
const btnCancelar = document.getElementById('btnCancelarIdentificacion');

let ultimaIdentificacion = null;
let geminiRequestActive = false;
let retryCount = 0;
const maxRetries = 1;

  function identificar() {
    if (photoFiles.length === 0) {
      alert("Por favor, sube o toma una foto primero para poder identificar la planta.");
      return;
    }
    
    geminiRequestActive = true;
    retryCount = 0;
    btnAceptar.disabled = true;
    modalTitle.textContent = "Identificando Planta";
    
    modalBody.innerHTML = `<div class="plant-loader"></div><p>Analizando imagen con IA... Por favor, espera.</p>`;
    
    modal.classList.add('active');
    document.body.classList.add('modal-open');

    const reader = new FileReader();
    reader.onload = (e) => {
      llamarApiGemini({ base64: e.target.result, mimeType: photoFiles[0].type });
    };
    reader.readAsDataURL(photoFiles[0]);
  }

  function llamarApiGemini(imageData) {
    if (!geminiRequestActive) return;

    google.script.run
      .withSuccessHandler(onGeminiSuccess)
      .withFailureHandler(onGeminiFailure)
      .identificarPlanta(imageData);
  }

  function onGeminiSuccess(response) {
    if (!geminiRequestActive) return;
    
    if (response.success && response.data.nombreComun) {
      ultimaIdentificacion = response.data;
      modalTitle.textContent = "¡Planta Identificada!";
      modalBody.innerHTML = `
        <p>Esta es tu planta:</p>
        <div id="gemini-result-display">
          <strong>Nombre Común:</strong> ${escapeHtml(ultimaIdentificacion.nombreComun)}<br>
          <strong>Nombre Científico:</strong> ${escapeHtml(ultimaIdentificacion.nombreCientifico)}<br>
          <strong>Familia:</strong> ${escapeHtml(ultimaIdentificacion.familia)}<br>
          <strong>Uso Sugerido:</strong> ${escapeHtml(ultimaIdentificacion.uso)}
        </div>
      `;
      btnAceptar.disabled = false;
    } else {
      onGeminiFailure({ message: response.message || "No fue posible identificar la planta con suficiente confianza." });
    }
  }
  
  function onGeminiFailure(error) {
    if (!geminiRequestActive) return;

    if (retryCount < maxRetries) {
      retryCount++;
      console.log(`Intento fallido. Reintentando (${retryCount}/${maxRetries})...`);

      const reader = new FileReader();
      reader.onload = (e) => llamarApiGemini({ base64: e.target.result, mimeType: photoFiles[0].type });
      reader.readAsDataURL(photoFiles[0]);
    } else {
      modalTitle.textContent = "No pude leerla";
      modalBody.innerHTML = `<p>${escapeHtml(error.message || 'No pude identificar esa planta.')}<br>Intenta tomar una foto más clara o ingrésala manualmente.</p>`;
    }
  }

  function aceptarIdentificacion() {
    if (ultimaIdentificacion) {
      document.getElementById("nombre_comun").value = ultimaIdentificacion.nombreComun || "";
      document.getElementById("nombre_cientifico").value = ultimaIdentificacion.nombreCientifico || "";
      document.getElementById("familia").value = ultimaIdentificacion.familia || "";
      document.getElementById("uso").value = ultimaIdentificacion.uso || "";
    }
    cerrarModal();
  }

  function cerrarModal() {
    geminiRequestActive = false;
    modal.classList.remove('active');
  }

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  btnIdentificar.addEventListener('click', identificar);
  btnAceptar.addEventListener('click', aceptarIdentificacion);
  btnCancelar.addEventListener('click', cerrarModal);

  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingText = document.getElementById('loading-text');
  const btnCancelarProceso = document.getElementById('btnCancelarProceso');
  let esCancelable = true;

  function showLoader(message, cancelable = true) {
    loadingText.textContent = message;
    esCancelable = cancelable;
    btnCancelarProceso.style.display = cancelable ? 'inline-block' : 'none';
    loadingOverlay.style.display = 'flex';
  }

  function hideLoader() {
    loadingOverlay.style.display = 'none';
  }

  btnCancelarProceso.addEventListener('click', () => {
    if (esCancelable) {
      hideLoader();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Registrar Planta';
      document.getElementById('status').textContent = 'Registro cancelado por el usuario.';
      document.getElementById('status').style.color = 'orange';
    }
  });

  </script>
